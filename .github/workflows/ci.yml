name: build-and-test
# Linux tests for pull requests and pushes to main. Windows tests and the
# installers for every platform live in native-installers.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: cargo test --workspace --locked
      - run: cargo build --bins --example virtual_agent --locked
      - run: python tests/cli_smoke.py
        timeout-minutes: 2
      - run: python tests/catalog_check.py
      - run: npm ci && npx playwright install --with-deps chromium && npm test && npm run build
        working-directory: apps/desktop
