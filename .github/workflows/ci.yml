name: build-and-test
# The test suites. Pull requests run the Linux tests. On main this workflow is
# called by native-installers.yml, which adds the Windows tests and builds the
# installers only after every test here has passed.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: cargo test --workspace --locked
      - run: cargo build --bins --example virtual_agent --locked
      - run: python tests/cli_smoke.py
        timeout-minutes: 2
      - run: python tests/catalog_check.py
      - run: npm ci && npx playwright install --with-deps chromium && npm test && npm run build
        working-directory: apps/desktop

  windows:
    # Only on main, where native-installers.yml calls this workflow.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo build --locked
      - run: python tests/cli_smoke.py
        timeout-minutes: 2
