name: release-installers
# Runs only on main. Every push runs the Windows tests. The Windows installer,
# the macOS DMG and the Linux packages are built, and a release published, only
# when tauri.conf.json has a version without a GitHub release yet
# (see packages/bump-version.py).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_installers:
        description: Build the installers even if this version is already released (no release changes)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: native-installers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that every file carries the same version
        run: python3 packages/bump-version.py --check
      - id: plan
        name: Release only a version that has no GitHub release yet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE_BUILD: ${{ inputs.build_installers || false }}
        run: |
          tag="v$(python3 packages/version.py)"
          if gh release view "$tag" >/dev/null 2>&1; then
            release=false
            echo "::notice::$tag is already released; skipping the installers. Run packages/bump-version.py to release a new version."
          else
            release=true
            echo "::notice::$tag has no release yet; building installers and publishing it."
          fi
          build=$release
          if [ "$FORCE_BUILD" = "true" ]; then build=true; fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  windows:
    # Tests run on every push to main; the installer only when one is needed.
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: cargo test --workspace --locked
      - run: cargo build --locked
      - run: python tests/cli_smoke.py
        timeout-minutes: 2
      - if: needs.plan.outputs.build == 'true'
        run: python packages/build.py
      - if: needs.plan.outputs.build == 'true'
        run: python packages/check-windows-binaries.py
      - if: needs.plan.outputs.build == 'true'
        run: npm ci && npm run tauri build -- --bundles nsis
        working-directory: apps/desktop
      - if: needs.plan.outputs.build == 'true'
        run: python packages/check-windows-binaries.py --gui apps/desktop/src-tauri/target/release/elarydil-kvm-gui.exe
      - if: needs.plan.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: elarydil-kvm-windows-x64
          retention-days: 7
          path: |
            dist/
            apps/desktop/src-tauri/target/release/bundle/nsis/

  macos:
    # macOS minutes are the most expensive: this job only builds the DMG, and
    # only for a new release.
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: aarch64-apple-darwin}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: python3 packages/build.py
        env: {ELARYDIL_KVM_TARGET: aarch64-apple-darwin}
      - run: npm ci && npm run tauri build -- --target aarch64-apple-darwin --bundles app,dmg
        working-directory: apps/desktop
      - name: Collect the DMG and CLI bundle
        run: |
          version=$(python3 packages/version.py)
          cp "apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Elarydil KVM_${version}_aarch64.dmg" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: elarydil-kvm-macos-arm64
          retention-days: 7
          path: dist/

  linux:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev rpm
      - run: python3 packages/build.py
      - run: npm ci && npm run tauri build -- --bundles deb,rpm
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: elarydil-kvm-linux-x64
          retention-days: 7
          path: |
            dist/
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm

  release:
    needs: [plan, windows, macos, linux]
    if: needs.plan.outputs.release == 'true' && github.repository == 'elarydil/elarydil-kvm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Require the Linux checks on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          check_run=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$check_run"
          test "$check_run" != "null"
          gh run watch "$check_run" --exit-status --interval 10
      - uses: actions/download-artifact@v4
        with:
          pattern: elarydil-kvm-*
          path: native-artifacts
      - run: python3 packages/prepare-release.py --artifacts native-artifacts --output release-assets
      - name: Publish the release for tauri.conf.json's version after successful checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 packages/version.py)
          tag="v${version}"
          notes="docs/releases/${version}.md"
          test -f "$notes"
          # A draft left by an interrupted run is reused; anything else was ruled out by plan.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Elarydil KVM ${version}" --notes-file "$notes"
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false --latest
