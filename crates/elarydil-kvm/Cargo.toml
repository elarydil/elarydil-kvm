[package]
name = "elarydil-kvm"
version = "1.0.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
directories = "6"
chrono = { version = "0.4", features = ["serde"] }
nusb = "0.2"
futures-lite = "2"
interprocess = "2"
schemars = "1"
libc = "0.2"


[dev-dependencies]
tempfile = "3"

[build-dependencies]
static_vcruntime = "3.0"


[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Graphics_Gdi", "Win32_Devices_Display", "Win32_System_Registry", "Win32_Storage_FileSystem"]

[target.'cfg(windows)'.dependencies.widestring]
version = "1"
